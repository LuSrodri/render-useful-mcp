name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Regenerating must be a no-op: the committed catalogue has to match the spec.
      - name: Verify generated catalogue is up to date
        run: |
          npm run generate
          git diff --exit-code src/generated/operations.json

      # The docs quote the catalogue — tool counts, the toolset table, llms.txt. Checking
      # them here is what stops a spec update from leaving the prose describing the old API.
      - name: Verify documentation matches the catalogue
        run: npm run docs:check

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
