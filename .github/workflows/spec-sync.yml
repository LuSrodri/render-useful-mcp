##
# Watches Render's published API description and opens a pull request when it changes.
#
# Render does not serve its OpenAPI document from a stable URL, so `scripts/fetch-spec.ts`
# extracts it from the docs HTML. That is fragile by nature, which is why a failed
# extraction fails this workflow loudly instead of being reported as "no changes" — going
# quietly blind to upstream changes would be far worse than a noisy red run.
#
# The PR is never merged automatically. New Render endpoints can be breaking (a removed
# tool, a newly required argument), so a human reviews the summary the diff produces.
#
# ## Why this used to look like it never ran
#
# It did run — but weekly, and at minute 0, which is the single most contended slot on
# GitHub's scheduled-workflow queue. Observed delay on the 2026-08-03 run was nearly four
# hours, and GitHub drops scheduled runs outright under load rather than queueing them
# forever. A dropped weekly run means a fortnight of going blind, with nothing in the
# Actions tab to say so. Two changes address that:
#
#   1. Daily, at an unremarkable minute. Cost is one cheap job a day, since a run that
#      finds no catalogue change stops before it opens anything.
#   2. A heartbeat file, committed at most every 20 days. GitHub disables scheduled
#      workflows in repositories with 60 days of no activity, and this repository does go
#      quiet — that alone would eventually stop the sync for good. The commit resets the
#      clock, and doubles as visible proof in the git log that the routine is alive.
##
name: Spec sync

on:
  schedule:
    # Daily at 05:47 UTC. Deliberately not on the hour: scheduled workflows are queued
    # best-effort and the top of the hour is where they pile up and get dropped.
    - cron: '47 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# A second run while one is in flight would race on the same branch.
concurrency:
  group: spec-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Keep the pre-change catalogue so the PR body can describe what actually moved.
      - name: Snapshot the current catalogue
        run: cp src/generated/operations.json "$RUNNER_TEMP/before.json"

      # Any failure here is a real failure: either the network is down or, more likely,
      # Render changed their docs platform and the extraction needs to be re-derived.
      - name: Fetch the current Render spec
        run: npx tsx scripts/fetch-spec.ts

      - name: Detect changes
        id: detect
        run: |
          if git diff --quiet spec/render-openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Spec is unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Spec changed."
          fi

      - name: Regenerate the tool catalogue
        if: steps.detect.outputs.changed == 'true'
        run: npm run generate

      # A spec change that does not alter the catalogue is formatting or prose only.
      # Opening a PR for that is pure noise, so stop here.
      - name: Check whether the catalogue actually changed
        if: steps.detect.outputs.changed == 'true'
        id: catalogue
        run: |
          if git diff --quiet src/generated/operations.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Spec changed but the tool catalogue did not."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The docs quote the catalogue — tool counts, the toolset table, the site, llms.txt.
      # Regenerating them here is what makes "the API changed" and "the docs say so" a
      # single reviewable pull request instead of two, the second of which never happens.
      - name: Regenerate the documentation
        if: steps.catalogue.outputs.changed == 'true'
        run: npm run docs

      # Runs before the PR is opened: a catalogue that fails the suite is still worth
      # surfacing, but the reviewer must see that up front rather than discover it in CI.
      - name: Verify the regenerated catalogue
        if: steps.catalogue.outputs.changed == 'true'
        id: verify
        continue-on-error: true
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Summarise the change
        if: steps.catalogue.outputs.changed == 'true'
        id: summary
        run: |
          {
            echo 'body<<PR_BODY_EOF'
            echo "Render's published API description changed. This PR updates the vendored spec and the generated tool catalogue."
            echo
            npx tsx scripts/diff-catalogue.ts "$RUNNER_TEMP/before.json" src/generated/operations.json
            echo
            if [ "${{ steps.verify.outcome }}" = "success" ]; then
              echo '✅ Lint, type-check and tests pass against the regenerated catalogue.'
            else
              echo '> [!CAUTION]'
              echo '> Lint, type-check or tests **failed** against the regenerated catalogue.'
              echo '> The generator refuses to emit a catalogue it cannot fully model, so this usually'
              echo '> means Render introduced a shape the generator needs to learn. See the run logs.'
            fi
            echo
            echo '---'
            echo '_Opened automatically by `.github/workflows/spec-sync.yml`._'
            echo PR_BODY_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.catalogue.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.summary.outputs.body }}
        run: |
          BRANCH="spec-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add spec/render-openapi.json src/generated/operations.json README.md plugin/README.md docs
          git commit -m "Sync Render API spec and regenerate tool catalogue"
          # Force-push: the branch is a disposable mirror of the latest upstream spec,
          # not a history worth preserving across runs.
          git push --force origin "$BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body "$BODY"
            echo "Updated existing pull request."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Sync Render API spec" \
              --body "$BODY"
          fi

      ##
      # Everything below runs on every outcome, including "nothing changed".
      ##

      # Without this, a run that finds no change leaves no trace at all, which is what made
      # a working weekly job look like a broken one.
      - name: Report to the run summary
        if: always()
        run: |
          {
            echo "## Spec sync — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            if [ "${{ steps.detect.outputs.changed }}" = "true" ]; then
              if [ "${{ steps.catalogue.outputs.changed }}" = "true" ]; then
                echo "Render's spec changed and the tool catalogue changed with it. A pull request is open on \`spec-sync\`."
              else
                echo "Render's spec changed, but only in prose or formatting — the tool catalogue is unaffected. No pull request opened."
              fi
            else
              echo "Render's spec is unchanged. Nothing to do."
            fi
            echo
            echo "Next scheduled check: tomorrow at 05:47 UTC."
          } >> "$GITHUB_STEP_SUMMARY"

      # GitHub disables scheduled workflows after 60 days without repository activity, and
      # a disabled workflow cannot re-enable itself. Committing a timestamp every 20 days
      # keeps the clock well short of that, at roughly 18 commits a year.
      - name: Refresh the heartbeat
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATE=".github/spec-sync-heartbeat.json"
          NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          MAX_AGE_DAYS=20

          # The pull-request step above may have left us on the spec-sync branch.
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main

          PREVIOUS=$(jq -r '.lastHeartbeat // empty' "$STATE" 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            AGE=$(( ( $(date -u +%s) - $(date -u -d "$PREVIOUS" +%s) ) / 86400 ))
            if [ "$AGE" -lt "$MAX_AGE_DAYS" ]; then
              echo "Heartbeat is $AGE days old; nothing to do until it reaches $MAX_AGE_DAYS."
              exit 0
            fi
          fi

          mkdir -p .github
          # `\$comment` is escaped so the shell leaves the key alone; $NOW and
          # $MAX_AGE_DAYS are meant to expand.
          cat > "$STATE" <<JSON
          {
            "\$comment": "Written by .github/workflows/spec-sync.yml. Its only job is to be a commit: GitHub disables scheduled workflows after 60 days of repository inactivity, and a disabled workflow cannot re-enable itself.",
            "lastHeartbeat": "$NOW",
            "workflow": "spec-sync",
            "intervalDays": $MAX_AGE_DAYS
          }
          JSON

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATE"
          git commit -m "Refresh spec-sync heartbeat"
          git push origin main
