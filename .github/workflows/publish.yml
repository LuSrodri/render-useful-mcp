##
# Releases to two places when a `v*` tag is pushed, or when dispatched manually against an
# existing tag to retry a failed release:
#
#   1. npm            — the artifact itself.
#   2. MCP Registry   — metadata only, pointing at the npm package published in step 1.
#
# Both authenticate with the same GitHub OIDC token; neither uses a stored secret.
#
# ---------------------------------------------------------------------------------------
# npm, via Trusted Publishing
#
# npm exchanges GitHub's short-lived OIDC token for a scoped publish credential. The trust
# relationship is configured on npmjs.com under Settings -> Trusted Publisher, and every
# field it stores is compared literally:
#
#   Organization or user   LuSrodri          <- GitHub user, NOT the npm login `lusrodri`
#   Repository             render-useful-mcp
#   Workflow filename      publish.yml       <- renaming this file breaks publishing
#   Environment name       (empty)           <- this workflow declares no environment
#   Allowed actions        npm publish
#
# The comparison is case-sensitive and npm validates none of it when you save. A
# mismatch surfaces only at publish time, as a misleading
# `OIDC token exchange error - package not found`.
#
# ---------------------------------------------------------------------------------------
# MCP Registry, via `mcp-publisher login github-oidc`
#
# Nothing needs configuring on the registry side: it derives the namespace from the OIDC
# token's `repository_owner` claim and grants `io.github.LuSrodri/*`. Two consequences
# worth knowing, both enforced by `test/server-json.test.ts`:
#
#   - The namespace comparison is a case-sensitive prefix match against the GitHub login,
#     so the name in `server.json` must be `io.github.LuSrodri/...`, not `io.github.lusrodri/...`.
#   - The registry proves package ownership by fetching the published npm tarball and
#     requiring its `package.json` to carry `mcpName` equal to that same name. So the
#     registry can only ever be published *after* npm, never before.
##
name: Publish

on:
  push:
    tags:
      - 'v*'
  # Lets a failed release be retried from the Actions tab without moving the tag.
  # Pick the tag under "Use workflow from"; the guard below rejects branches.
  workflow_dispatch:

permissions:
  # Required for OIDC. Without it npm falls back to token auth and fails with ENEEDAUTH.
  id-token: write
  # `write` rather than `read` so the last step can cut a GitHub Release. Nothing else in
  # this workflow writes to the repository.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest # Trusted publishing does not support self-hosted runners.

    steps:
      - uses: actions/checkout@v6

      # `registry-url` is deliberately omitted, despite npm's own example including it.
      # It makes setup-node write `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # into the runner's .npmrc. With trusted publishing there is no NODE_AUTH_TOKEN, so
      # that expands to an empty credential, npm concludes auth is already configured and
      # never starts the OIDC exchange — failing with ENEEDAUTH/E404.
      # See npm/documentation#1960 and actions/setup-node#1440.
      # registry.npmjs.org is the default registry anyway, so nothing is lost.
      #
      # Omitting it also keeps setup-node's `token` input (which defaults to github.token)
      # out of the picture: the action only calls configAuthentication when registry-url is
      # set, so NODE_AUTH_TOKEN is never exported and cannot shadow the OIDC credential.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          # Dependency caching is deliberately omitted: a release builds from a clean tree.

      # Trusted publishing needs npm >= 11.5.1. Node 24 has bundled a new enough npm
      # since 24.7.0, so the runner's own npm is used deliberately — installing
      # npm@latest here would silently opt into whatever major ships next.
      - name: Show toolchain versions
        run: |
          node --version
          npm --version

      # Every published version must correspond to a tag, including on manual retries —
      # otherwise a dispatch from `main` could ship whatever happens to be committed.
      - name: Require a tag matching package.json
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "This workflow must run from a tag, but ran from $GITHUB_REF_TYPE '$GITHUB_REF_NAME'." >&2
            echo "Re-dispatch it and select a v* tag under 'Use workflow from'." >&2
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG." >&2
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "package=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "server=$(node -p "require('./server.json').name")" >> "$GITHUB_OUTPUT"
          echo "Publishing version $PKG"

      # Publishing to npm is irreversible and publishing to the registry rejects a version
      # it already holds, so each target is checked separately rather than the whole run
      # being failed. That is what makes a retry useful: if npm succeeded last time and the
      # registry did not, re-dispatching the tag skips npm and finishes the job.
      - name: Work out what still needs publishing
        id: state
        env:
          NAME: ${{ steps.version.outputs.package }}
          VERSION: ${{ steps.version.outputs.version }}
          SERVER: ${{ steps.version.outputs.server }}
        run: |
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            NPM_DONE=true
          else
            NPM_DONE=false
          fi

          # The registry has no "does this version exist" endpoint; search returns every
          # version of a server, so match on the exact name and version ourselves.
          REGISTRY_DONE="$(
            curl -fsS --get \
              --data-urlencode "search=$SERVER" \
              https://registry.modelcontextprotocol.io/v0.1/servers \
            | VERSION="$VERSION" SERVER="$SERVER" node -e '
                let raw = "";
                process.stdin.on("data", (chunk) => (raw += chunk)).on("end", () => {
                  const servers = JSON.parse(raw).servers ?? [];
                  const match = servers.some((entry) => {
                    const server = entry.server ?? entry;
                    return server.name === process.env.SERVER && server.version === process.env.VERSION;
                  });
                  process.stdout.write(String(match));
                });
              '
          )"

          echo "npm=$NPM_DONE registry=$REGISTRY_DONE"
          if [ "$NPM_DONE" = "true" ] && [ "$REGISTRY_DONE" = "true" ]; then
            echo "$NAME@$VERSION is already on npm and in the MCP Registry. Bump the version to release again." >&2
            exit 1
          fi
          echo "publish-npm=$([ "$NPM_DONE" = "false" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "publish-registry=$([ "$REGISTRY_DONE" = "false" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # The published catalogue must be the one that was reviewed, not one the build
      # silently regenerated from a spec that changed underneath it.
      - name: Verify generated catalogue is up to date
        run: |
          npm run generate
          git diff --exit-code src/generated/operations.json

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The bundle Claude for macOS and Windows installs. It is attached to the GitHub
      # Release below rather than published anywhere, because the MCPB directory has no
      # registry: users and the submission form both take the file itself.
      #
      # `build` has already run, so this calls the packer directly rather than going through
      # `npm run build:mcpb` and rebuilding `dist/` a second time.
      - name: Build the desktop extension bundle
        id: mcpb
        run: |
          npx tsx scripts/build-mcpb.ts
          BUNDLE="build/render-useful-mcp-${{ steps.version.outputs.version }}.mcpb"
          test -f "$BUNDLE" || { echo "Packer produced no $BUNDLE." >&2; exit 1; }
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"

      # Provenance attestation is generated automatically for public repo + public package.
      # --verbose so an auth failure shows which credential path npm actually took.
      - name: Publish to npm
        if: steps.state.outputs.publish-npm == 'true'
        run: npm publish --verbose

      # The registry validates ownership by fetching the tarball's package.json from
      # registry.npmjs.org, which lags `npm publish` by a few seconds. Without this wait the
      # very first release fails on "Registry validation failed for package" — a confusing
      # error for what is only a propagation delay.
      - name: Wait for npm to serve the new version
        if: steps.state.outputs.publish-npm == 'true' && steps.state.outputs.publish-registry == 'true'
        env:
          NAME: ${{ steps.version.outputs.package }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "https://registry.npmjs.org/$NAME" \
              | VERSION="$VERSION" node -e '
                  let raw = "";
                  process.stdin.on("data", (chunk) => (raw += chunk)).on("end", () => {
                    process.exit(JSON.parse(raw).versions?.[process.env.VERSION] ? 0 : 1);
                  });
                ';
            then
              echo "$NAME@$VERSION is being served after $attempt attempt(s)."
              exit 0
            fi
            sleep 5
          done
          echo "$NAME@$VERSION did not appear on registry.npmjs.org within 150s." >&2
          echo "npm published successfully; re-dispatch this tag to retry the registry step alone." >&2
          exit 1

      # Pinning is deliberately avoided: the registry is in preview and rejects binaries
      # that predate a deployment with "invalid audience", so the newest release is the only
      # version guaranteed to work against it today.
      - name: Install mcp-publisher
        if: steps.state.outputs.publish-registry == 'true'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      # server.json carries the released version in two places, and both must equal the tag.
      # The committed values track package.json (asserted by test/server-json.test.ts) so a
      # hand-run `mcp-publisher publish` also works, but stamping them here means the tag —
      # not the working tree — is what decides.
      - name: Stamp the released version into server.json
        if: steps.state.outputs.publish-registry == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const version = process.env.VERSION;
            const manifest = JSON.parse(fs.readFileSync("server.json", "utf8"));
            manifest.version = version;
            for (const pkg of manifest.packages ?? []) pkg.version = version;
            fs.writeFileSync("server.json", `${JSON.stringify(manifest, null, 2)}\n`);
          '
          node -p "JSON.stringify(require('./server.json'), null, 2)"

      # Exchanges the job's OIDC token for a 5-minute registry JWT. No secret involved; the
      # `id-token: write` permission above is what makes it possible.
      - name: Authenticate to the MCP Registry
        if: steps.state.outputs.publish-registry == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        if: steps.state.outputs.publish-registry == 'true'
        run: ./mcp-publisher publish

      # A tag on its own leaves the Releases page empty, so the only public record of a
      # version is the npm page. This step is unconditional and idempotent: it runs even
      # when both publish steps were skipped on a retry, and leaves the notes of an existing
      # release alone — so a re-dispatch never fails here.
      #
      # The bundle upload is the exception to "leave it alone": it uses --clobber and runs on
      # both paths, so a retry that exists only to attach a missing artifact does attach it.
      - name: Publish a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.version.outputs.package }}
          VERSION: ${{ steps.version.outputs.version }}
          SERVER: ${{ steps.version.outputs.server }}
          BUNDLE: ${{ steps.mcpb.outputs.bundle }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its notes alone."
            gh release upload "$TAG" "$BUNDLE" --repo "$REPO" --clobber
            echo "Attached $BUNDLE."
            exit 0
          fi

          # GitHub derives the changelog from the commits since the previous tag. Asking the
          # API for it (rather than `gh release create --generate-notes`) leaves room to
          # prepend the install snippet, which the flag would otherwise overwrite.
          #
          # `|| true` matters: this step runs after npm and the registry have already been
          # published, and those are irreversible. A hiccup generating prose must degrade to
          # a release without a changelog, not fail a job whose real work already succeeded.
          NOTES="$(gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body || true)"
          if [ -z "$NOTES" ]; then
            echo "Could not generate release notes; publishing the release without them." >&2
            NOTES="See the commit history for what changed."
          fi

          {
            echo "Published to [npm](https://www.npmjs.com/package/$NAME/v/$VERSION) and the"
            echo "[MCP Registry](https://registry.modelcontextprotocol.io/v0/servers?search=$SERVER)."
            echo
            echo "For **Claude for macOS and Windows**, download \`$(basename "$BUNDLE")\` below and open it."
            echo
            echo '```jsonc'
            echo '// Claude Code: claude mcp add render -- npx -y '"$NAME"'@'"$VERSION"
            echo '// or, in an MCP client config:'
            echo '{ "command": "npx", "args": ["-y", "'"$NAME"'@'"$VERSION"'"],'
            echo '  "env": { "RENDER_API_KEY": "rnd_..." } }'
            echo '```'
            echo
            echo "$NOTES"
          } > release-notes.md

          gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file release-notes.md "$BUNDLE"
          echo "Created release $TAG with $BUNDLE attached."
